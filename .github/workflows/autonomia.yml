name: Autonomia
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  localise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: pip install pillow
      - run: python3 tools/localise.py
      - run: |
          git config user.name "Phonodia Site"
          git config user.email "contact@phonodia.com"
          git add -A
          git diff --cached --quiet || git commit -m "Autonomia"
          git push
