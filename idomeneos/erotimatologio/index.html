:root {
  --paper:#EEEDF6; --paper-2:#E0DEF0; --card:#F8F7FD;
  --ink:#1C1A2C; --ink-soft:#46415F; --head:#1B3A6B;
  --btn-bg:#1B3A6B; --btn-ink:#F8F7FD;
  --gold:#C29A3E; --gold-deep:#7A5C18;
  --staff:rgba(122,92,24,.38);
  --line:rgba(28,26,44,.16); --line-soft:rgba(28,26,44,.08);
  --glow1:rgba(27,58,107,.13); --glow2:rgba(194,154,62,.20);
  --grain:.06;
  --serif:'Alegreya', Georgia, 'Times New Roman', serif;
  --sans:'Alegreya Sans', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper:#0D1626; --paper-2:#16223A; --card:#121D31;
    --ink:#EDF0F7; --ink-soft:rgba(237,240,247,.78); --head:#EDF0F7;
    --btn-bg:#D4AE55; --btn-ink:#0D1626;
    --gold:#D4AE55; --gold-deep:#D4AE55;
    --staff:rgba(212,174,85,.42);
    --line:rgba(237,240,247,.22); --line-soft:rgba(237,240,247,.1);
    --glow1:rgba(80,120,200,.16); --glow2:rgba(212,174,85,.12);
    --grain:.03;
    color-scheme: dark;
  }
}

* { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; background:var(--paper); }
body {
  margin:0; min-height:100vh; min-height:100svh;
  color:var(--ink); font-family:var(--serif); font-size:1.2rem; line-height:1.6;
}
body::before {
  content:""; position:fixed; inset:0; z-index:-2;
  background:
    radial-gradient(110% 55% at 92% -8%, var(--glow1), transparent 62%),
    radial-gradient(90% 50% at -10% 108%, var(--glow2), transparent 62%),
    var(--paper);
}
body::after {
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:var(--grain);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35 0 0 0 0 .27 0 0 0 0 .2 0 0 0 .9 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}

.wrap { max-width:42rem; margin:0 auto; padding:26px max(20px, env(safe-area-inset-right)) 80px max(20px, env(safe-area-inset-left)); }
.brand { font-family:var(--sans); font-size:1rem; letter-spacing:.07em; color:var(--ink-soft); margin:0; }

/* Πεντάγραμμο: κάθε απάντηση αφήνει μια νότα */
.staff { position:relative; height:54px; margin:14px 0 26px; }
.staff .ln { position:absolute; left:0; right:0; height:1px; background:var(--staff); }
.staff::before, .staff::after { content:""; position:absolute; top:9px; height:36px; width:1.5px; background:var(--staff); }
.staff::before { left:0; } .staff::after { right:0; }
.nt {
  position:absolute; width:14px; height:10.5px; border-radius:50%; background:var(--gold);
  transform:translate(-50%,-50%) rotate(-18deg) scale(.3); opacity:0;
  transition:opacity .5s ease, transform .5s ease, background .3s ease;
}
.nt i { position:absolute; left:calc(100% - 1.2px); bottom:50%; width:1.5px; height:27px; background:inherit; transform:rotate(18deg); transform-origin:bottom left; }
.nt.on { opacity:.92; transform:translate(-50%,-50%) rotate(-18deg) scale(1); }
.nt.cur { opacity:1; background:var(--head); transform:translate(-50%,-50%) rotate(-18deg) scale(1.25); box-shadow:0 0 0 6px color-mix(in srgb, var(--gold) 30%, transparent); }

.enter { animation:rise .55s cubic-bezier(.2,.7,.2,1) both; }
@keyframes rise { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
@media (prefers-reduced-motion: reduce) {
  .enter { animation:none; }
  .nt, .opt, .btn { transition:none !important; }
}

h1, h2, h3 { font-family:var(--serif); font-weight:500; color:var(--head); text-wrap:balance; margin:0; }
h1 { font-size:clamp(2.5rem,9vw,3.6rem); line-height:1.08; margin-bottom:.45rem; }
h2 { font-size:clamp(1.6rem,5.6vw,2.15rem); line-height:1.22; margin-bottom:1.1rem; }
h3 { font-size:1.55rem; line-height:1.25; margin-bottom:.6rem; }
h1:focus, h2:focus { outline:none; }
p { margin:0 0 1rem; text-wrap:pretty; }
.sub { font-size:1.25rem; color:var(--ink-soft); margin-bottom:1.8rem; }
.eyebrow { font-family:var(--sans); font-size:1rem; letter-spacing:.08em; color:var(--gold-deep); margin:0 0 .6rem; font-weight:500; }
.hint { color:var(--ink-soft); font-style:italic; margin:-.4rem 0 1.1rem; }

.promise {
  display:flex; gap:12px; align-items:flex-start;
  background:color-mix(in srgb, var(--card) 80%, transparent); border:1px solid var(--line); border-radius:14px;
  padding:14px 16px; margin:1.6rem 0 1.8rem; font-size:1.1rem; color:var(--ink);
}
.promise::before { content:""; flex:none; width:9px; height:9px; margin-top:.55em; border-radius:50%; background:var(--gold); }
.promise p { margin:0; }

.btn {
  display:inline-flex; align-items:center; gap:10px; min-height:52px; padding:0 28px; border-radius:999px; border:0;
  background:var(--btn-bg); color:var(--btn-ink); font:500 1.12rem var(--sans); letter-spacing:.02em; text-decoration:none; cursor:pointer;
  transition:transform .2s ease, box-shadow .2s ease; -webkit-tap-highlight-color:transparent;
}
.btn .dot { width:8px; height:8px; border-radius:50%; background:var(--gold); }
@media (prefers-color-scheme: dark) { .btn .dot { background:var(--btn-ink); } }
.btn:hover { transform:translateY(-2px); box-shadow:0 10px 24px -12px rgba(27,58,107,.6); }
.btn:focus-visible, .link:focus-visible, input:focus-visible, a:focus-visible { outline:2px solid var(--gold); outline-offset:3px; }
.btn-line { background:transparent; color:var(--head); border:1.5px solid var(--head); }
.btn-line:hover { box-shadow:none; background:color-mix(in srgb, var(--head) 8%, transparent); }
.link { background:none; border:0; padding:8px 4px; font:500 1.05rem var(--sans); color:var(--ink-soft); cursor:pointer; letter-spacing:.02em; }
.link:hover { color:var(--head); text-decoration:underline; text-decoration-color:var(--gold); text-underline-offset:4px; }

/* Επιλογές */
.opts { margin:0 0 .8rem; }
.opt {
  display:flex; gap:14px; align-items:flex-start; width:100%; text-align:left; font:inherit; font-size:1.18rem; line-height:1.4; color:var(--ink);
  background:var(--card); border:1px solid var(--line); border-radius:16px; padding:15px 18px; margin:0 0 12px; cursor:pointer;
  transition:border-color .2s, transform .2s, box-shadow .2s, background .2s; -webkit-tap-highlight-color:transparent;
}
.opt:hover { border-color:var(--gold); box-shadow:0 8px 24px -14px rgba(27,58,107,.45); transform:translateY(-1px); }
.opt:focus-visible { outline:2px solid var(--gold); outline-offset:3px; }
.opt[aria-pressed="true"] { border-color:var(--head); background:color-mix(in srgb, var(--head) 9%, var(--card)); }
.ltr {
  flex:none; display:grid; place-items:center; width:34px; height:34px; border-radius:50%;
  border:1.5px solid var(--gold); color:var(--gold-deep); font-style:italic; font-size:1.15rem; line-height:1; transition:background .2s, color .2s;
}
.opt[aria-pressed="true"] .ltr { background:var(--gold); color:#1C1A2C; }
.navrow { display:flex; justify-content:space-between; align-items:center; min-height:44px; }

/* Σημείωμα */
.result section { margin-top:2.6rem; padding-top:2.2rem; border-top:1px solid var(--line); }
.result section:first-of-type { margin-top:1.2rem; }
.level { display:inline-block; position:relative; font-size:clamp(3.4rem,16vw,6rem); line-height:1; font-weight:500; color:var(--head); margin:.05em 0 .3em; padding-bottom:.12em; }
.level::after { content:""; position:absolute; left:0; bottom:-6px; width:100%; height:2px; background:linear-gradient(90deg, var(--gold), transparent); }
.label { font-family:var(--sans); font-weight:500; color:var(--head); letter-spacing:.02em; margin:1.4rem 0 .5rem; font-size:1.1rem; }
ul.gold { margin:0 0 1rem; padding-left:1.2em; }
ul.gold li { margin-bottom:.6rem; padding-left:.3em; }
ul.gold li::marker { color:var(--gold); }
.route { background:var(--card); border:1px solid var(--line); border-left:3px solid var(--gold); border-radius:12px; padding:16px 18px; }
.route strong { color:var(--head); font-weight:500; }
.need { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:22px 22px 20px; margin:0 0 16px; }
.need-h { display:flex; align-items:center; gap:14px; margin-bottom:.8rem; }
.need-h .ltr { width:42px; height:42px; font-size:1.4rem; }
.need-h h3 { margin:0; }
.quote { font-style:italic; font-size:1.3rem; line-height:1.45; color:var(--ink); margin:0 0 .9rem; }
.why { color:var(--ink-soft); }
.today { background:var(--paper-2); border-left:3px solid var(--gold); border-radius:10px; padding:14px 16px; margin:0; }
.today .lab { display:block; font-family:var(--sans); font-weight:500; letter-spacing:.06em; color:var(--gold-deep); font-size:1rem; margin-bottom:.2rem; }
.today p { margin:0; }
.aside { background:color-mix(in srgb, var(--gold) 14%, var(--card)); border-radius:12px; padding:14px 18px; margin:0 0 1.2rem; }
.aside p { margin:0; }
.aside strong { font-weight:500; color:var(--head); }
.lead { font-size:1.3rem; }
.grid3 { display:grid; grid-template-columns:repeat(auto-fit, minmax(12rem, 1fr)); gap:12px; margin:.4rem 0 1rem; }
.grid3 div { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; }
.grid3 b { display:block; font-weight:500; color:var(--head); font-size:1.2rem; margin-bottom:.2rem; }
.grid3 span { font-size:1.08rem; line-height:1.45; display:block; }
.actions { display:flex; flex-wrap:wrap; gap:12px; margin:0 0 1.4rem; }
.mailbox { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; }
.mailbox p { margin:0 0 .8rem; }
.mailrow { display:flex; flex-wrap:wrap; gap:10px; }
.mailrow input {
  flex:1 1 14rem; min-height:52px; padding:0 18px; border-radius:999px; border:1.5px solid var(--line); background:var(--paper);
  color:var(--ink); font:1.1rem var(--serif);
}
.mailrow input::placeholder { color:var(--ink-soft); opacity:.8; }
.small { font-size:1rem; color:var(--ink-soft); margin:.8rem 0 0 !important; }
.status { min-height:1.5em; font-family:var(--sans); color:var(--head); margin:.8rem 0 0; }
.contact { margin:1.6rem 0 1rem; }
.contact .name { font-size:1.4rem; font-weight:500; color:var(--head); margin-bottom:.15rem; }
.contact p { margin:0 0 .2rem; }
a { color:var(--ink); text-decoration-color:var(--gold); text-underline-offset:4px; }
.closing { font-size:1.35rem; font-style:italic; color:var(--head); margin:1.2rem 0 0; }
.again { margin-top:2rem; text-align:center; }
.printhead { display:none; }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

@media print {
  body::before, body::after, .brand, .actions, .mailbox, .again, .noprint { display:none !important; }
  html { background:#fff; }
  body { color:#000; font-size:12pt; background:#fff; }
  .wrap { max-width:none; padding:0; }
  .printhead { display:block; font-family:var(--sans); margin:0 0 10pt; color:#000; }
  :root { --head:#1B3A6B; --gold-deep:#7A5C18; --ink-soft:#333; --card:#fff; --paper-2:#f3f0e6; --line:rgba(0,0,0,.25); }
  .need, .route, .grid3 div, .today, .aside { break-inside:avoid; }
  .enter { animation:none; }
  a { color:#000; }
}

function buildStaff() {
  var i, l, n;
  for (i = 0; i < 5; i++) { l = document.createElement('div'); l.className = 'ln'; l.style.top = (9 + i * 9) + 'px'; staff.appendChild(l); }
  for (i = 0; i < N; i++) {
    n = document.createElement('div'); n.className = 'nt';
    n.style.left = (6 + i * (88 / (N - 1))) + '%';
    n.style.top = (9 + CONTOUR[i] * 4.5) + 'px';
    n.appendChild(document.createElement('i'));
    staff.appendChild(n); notes.push(n);
  }
}
function updateStaff() {
  notes.forEach(function (n, i) {
    n.classList.toggle('on', step >= N || i < step);
    n.classList.toggle('cur', i === step);
  });
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ----- Βαθμολόγηση ----- */
function compute() {
  var sum = 0, cnt = 0, need = { a:0, b:0, c:0, d:0, e:0 }, pick = { a:0, b:0, c:0, d:0, e:0 };
  var falso = false, online = false;
  answers.forEach(function (ai, qi) {
    var o = Q[qi].o[ai];
    if (o[1] > 0) { sum += o[1]; cnt++; }
    need[o[2]]++;
    if (qi >= 10) pick[o[2]]++;
    if (o[3] === 'falso') falso = true;
    if (o[3] === 'online') online = true;
  });
  var avg = cnt ? sum / cnt : 1;
  var level = avg < 5 / 3 ? 1 : (avg < 7 / 3 ? 2 : 3);
  var order = ['a','b','c','d','e'];
  var top = order.slice().sort(function (x, y) {
    return (need[y] - need[x]) || (pick[y] - pick[x]) || (order.indexOf(x) - order.indexOf(y));
  }).slice(0, 3);
  return { level:level, top:top, falso:falso, online:online, avg:avg };
}
